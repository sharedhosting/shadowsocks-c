name: Build Ubuntu 24.04 Static

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu 24.04 Static AMD64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            python3 \
            binutils \
            file

      - name: Show toolchain
        run: |
          gcc --version
          cmake --version
          ninja --version

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DSS_DEPENDENCY_MODE=bundled \
            -DWITH_STATIC=ON \
            -DSS_BUILD_EXECUTABLES=ON \
            -DSS_BUILD_STATIC_LIBRARY=OFF \
            -DSS_BUILD_SHARED_LIBRARY=OFF \
            -DSS_MINIMAL=OFF \
            -DSS_ENABLE_REGEX=ON \
            -DSS_ENABLE_PLUGINS=ON \
            -DCMAKE_EXE_LINKER_FLAGS="-static" \
            -DCMAKE_INSTALL_PREFIX=/out

      - name: Build
        run: |
          cmake --build build --parallel 4

      - name: Run unit and vendor tests
        run: |
          ctest \
            --test-dir build \
            -L 'unit|vendor' \
            --output-on-failure \
            --no-tests=error

      - name: Run interoperability tests
        run: |
          python3 tests/interop.py \
            --self \
            --bin build/bin

          python3 tests/async_dns_interop.py \
            --bin build/bin

      - name: Install binaries
        run: |
          cmake --install build --strip

      - name: Collect binaries
        run: |
          set -e

          mkdir -p dist

          for name in \
            ss-server \
            ss-local \
            ss-manager \
            ss-redir \
            ss-tunnel
          do
            if [ ! -f "/out/bin/$name" ]; then
              echo "ERROR: Missing binary: $name"
              exit 1
            fi

            cp "/out/bin/$name" dist/
            chmod +x "dist/$name"
          done

      - name: Verify ELF binaries
        run: |
          set -e

          for f in dist/*; do
            echo "===== $f ====="

            file "$f"

            readelf -h "$f" | grep -q "Advanced Micro Devices X86-64"

            if readelf -l "$f" | grep -q INTERP; then
              echo "ERROR: Dynamic interpreter detected"
              exit 1
            fi

            if readelf -d "$f" | grep -q NEEDED; then
              echo "ERROR: Dynamic dependency detected"
              exit 1
            fi

            echo "Static ELF: OK"
          done

      - name: Test binaries
        run: |
          set -e

          for f in dist/*; do
            echo "===== $f ====="
            "$f" --version
          done

      - name: Generate SHA256
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Upload Ubuntu binaries
        uses: actions/upload-artifact@v7
        with:
          name: shadowsocks-c-ubuntu-amd64
          path: dist/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
