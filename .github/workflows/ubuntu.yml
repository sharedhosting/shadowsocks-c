name: Build Ubuntu 26.04 Static

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            python3 \
            binutils \
            file

      - name: Configure
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_EXE_LINKER_FLAGS="-static -fuse-ld=lld" \
            -DSS_DEPENDENCY_MODE=bundled \
            -DWITH_STATIC=ON \
            -DSS_BUILD_EXECUTABLES=ON \
            -DSS_BUILD_STATIC_LIBRARY=OFF \
            -DSS_BUILD_SHARED_LIBRARY=OFF \
            -DSS_MINIMAL=OFF

      - name: Build
        run: |
          cmake --build build --parallel

      - name: Collect static binaries
        run: |
          set -e

          mkdir -p dist

          for bin in \
            ss-server \
            ss-local \
            ss-manager \
            ss-redir \
            ss-tunnel
          do
            src=$(find build -type f -name "$bin" -print -quit)

            if [ -z "$src" ]; then
              echo "ERROR: Missing binary: $bin"
              exit 1
            fi

            cp "$src" "dist/$bin"
            chmod 755 "dist/$bin"
          done

      - name: Verify static binaries
        run: |
          set -e

          for f in dist/*; do
            echo "Checking: $f"

            file "$f"

            if readelf -l "$f" | grep -q INTERP; then
              echo "ERROR: Dynamic interpreter detected!"
              exit 1
            fi

            if readelf -d "$f" 2>/dev/null | grep -q NEEDED; then
              echo "ERROR: Dynamic dependencies detected!"
              exit 1
            fi
          done

          echo "All binaries are statically linked."

      - name: Show final files
        run: |
          ls -lh dist/

      - name: Upload Ubuntu binaries
        uses: actions/upload-artifact@v4
        with:
          name: shadowsocks-c-ubuntu-26.04-amd64-static
          path: dist/
          if-no-files-found: error
          retention-days: 30
