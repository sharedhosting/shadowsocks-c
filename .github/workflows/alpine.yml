name: Build Alpine Static

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: Alpine 3.24 Static AMD64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build static binaries
        run: |
          docker buildx build \
            --platform linux/amd64 \
            -f docker/static/Dockerfile \
            --target artifacts \
            --output type=local,dest=output \
            .

      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils file

      - name: Collect binaries
        run: |
          mkdir -p dist

          for name in \
            ss-server \
            ss-local \
            ss-manager \
            ss-redir \
            ss-tunnel
          do
            if [ ! -f "output/bin/$name" ]; then
              echo "ERROR: Missing binary: $name"
              exit 1
            fi

            cp "output/bin/$name" dist/
            chmod +x "dist/$name"
          done

      - name: Verify ELF binaries
        run: |
          set -e

          for f in dist/*; do
            echo "===== $f ====="

            file "$f"

            readelf -h "$f" | grep -q "Advanced Micro Devices X86-64"

            if readelf -l "$f" | grep -q INTERP; then
              echo "ERROR: Dynamic interpreter detected"
              exit 1
            fi

            if readelf -d "$f" | grep -q NEEDED; then
              echo "ERROR: Dynamic dependency detected"
              exit 1
            fi

            echo "Static ELF: OK"
          done

      - name: Test binaries
        run: |
          set -e

          for f in dist/*; do
            echo "===== $f ====="
            "$f" --version
          done

      - name: Generate SHA256
        run: |
          cd dist
          sha256sum * > SHA256SUMS

      - name: Upload Alpine binaries
        uses: actions/upload-artifact@v7
        with:
          name: shadowsocks-c-alpine-amd64
          path: dist/
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
